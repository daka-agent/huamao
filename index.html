<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>校猫日记</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* 加载指示：游戏包较大，弱网下让用户知道"在加载"而不是白屏 */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #9ab8dd;
      font-family: monospace;
      font-size: 15px;
      background: #1a1a2e;
      z-index: 10;
      transition: opacity 0.4s;
    }
    #loading .cat { font-size: 42px; animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* 竖屏提示：仅在「触摸设备 + 竖屏」下出现，桌面与横屏自动隐藏（不打扰电脑玩家）。
       校猫日记是横版画面（世界 1536×896），竖屏只能看到约四分之一的宽度，体验明显打折。
       做成可点关，玩家坚持竖屏也能继续玩。 */
    #rotate-hint { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #1a1a2e;
        color: #e8d5b0;
        font-family: monospace;
        text-align: center;
        padding: 28px;
        cursor: pointer;
      }
      #rotate-hint .icon { font-size: 54px; animation: tilt 1.8s ease-in-out infinite; }
      @keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }
      #rotate-hint .title { font-size: 19px; letter-spacing: 1px; white-space: nowrap; }
      #rotate-hint .sub { font-size: 13px; color: #9ab8dd; line-height: 1.8; }
      #rotate-hint .tip { font-size: 12px; color: #7f93ad; line-height: 1.7; margin-top: 4px; }
      #rotate-hint .btns { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
      #rotate-hint .btn {
        font-family: monospace; font-size: 15px; padding: 12px 16px; border-radius: 10px;
        border: 1px solid #e8913a; background: transparent; color: #e8913a; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #rotate-hint .btn.primary { background: #e8913a; color: #1a1a2e; font-weight: bold; }
      #rotate-hint .btn:active { transform: scale(0.98); }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BiGRd_Vp.js"></script>
</head>
<body>
  <div id="game-root"></div>
  <div id="loading"><div class="cat">🐈</div><div>校园加载中…（首次打开约需几秒）</div></div>
  <div id="rotate-hint">
    <div class="icon">📱</div>
    <div class="title">请选择游玩方向</div>
    <div class="sub">校猫日记是横版画面</div>
    <div class="sub">横屏才能看全整条巷子，竖屏只能看到一小块</div>
    <div class="btns">
      <button class="btn primary" id="btn-landscape">横屏游玩（推荐）</button>
      <button class="btn" id="btn-portrait">仍要竖屏</button>
    </div>
    <div class="tip">选「横屏」后请把手机横过来；选「仍要竖屏」也能玩，只是视野较窄。</div>
  </div>
  <script>
    // 游戏启动后由 main.ts 隐藏加载提示
    window.__hideLoading = () => {
      const el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 500);
    };
    // 竖屏提示：必须点按钮选择，点空白处不关闭（以前点任意处就消失，玩家来不及反应）。
    // 选择记在 sessionStorage，本次会话内不再反复弹出。
    (function () {
      var el = document.getElementById('rotate-hint');
      if (!el) return;
      var KEY = 'daka-orient-choice';
      var choice = null;
      try { choice = sessionStorage.getItem(KEY); } catch (e) {}
      if (choice) el.style.display = 'none';
      function hide(v) {
        el.style.display = 'none';
        try { sessionStorage.setItem(KEY, v); } catch (e) {}
      }
      var bL = document.getElementById('btn-landscape');
      var bP = document.getElementById('btn-portrait');
      if (bL) bL.addEventListener('click', function (e) { e.stopPropagation(); hide('landscape'); });
      if (bP) bP.addEventListener('click', function (e) { e.stopPropagation(); hide('portrait'); });
      // 已经选过之后再次转屏，也不要重新弹出来打扰
      window.addEventListener('orientationchange', function () {
        try { if (sessionStorage.getItem(KEY)) el.style.display = 'none'; } catch (e) {}
      });
    })();
  </script>
</body>
</html>
